<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Atık Saat By Ömer Taha BATTAL</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
  position: relative;

  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;

  pointer-events: none;
}


.container {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);

  width: 100%;
  max-width: 100vw;
  box-sizing: border-box;

  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.clock-area {
  width: 100%;
  max-width: 100vw;
  box-sizing: border-box;
  overflow: hidden;
}


#clock {
  font-size: clamp(50px, min(10vw, 18vh), 200px);
  color: white;
  text-shadow: 3px 3px 10px black;
  line-height: 1;
  font-weight: normal;
  white-space: nowrap;
  max-width: 100%;
  box-sizing: border-box;
}


.date-area {
  margin-top: clamp(6px, 1vh, 10px);
}

#day {
  color: white;
  font-size: clamp(15px, 1.2vw, 23px);
  font-weight: bold;
  letter-spacing: clamp(1px, 0.15vw, 3px);
  text-shadow: 2px 2px 5px black;
  white-space: nowrap;
}

#date {
  margin-top: 3px;
  color: #bdbdbd;
  font-size: clamp(12px, 0.9vw, 17px);
  letter-spacing: clamp(1px, 0.1vw, 2px);
  text-shadow: 2px 2px 5px black;
  white-space: nowrap;
}


#lessonInfo {
  position: fixed;
  left: 50%;
  bottom: clamp(75px, 10vh, 115px);
  transform: translateX(-50%);

  width: min(90vw, 700px);
  box-sizing: border-box;

  text-align: center;
  color: rgba(255,255,255,0.72);

  font-family: Arial, sans-serif;
  text-shadow: 2px 2px 5px black;

  overflow: hidden;
}

#status {
  font-size: clamp(11px, 0.65vw, 13px);
  font-weight: bold;
  letter-spacing: 2px;
  white-space: nowrap;
}

#lesson {
  margin-top: 3px;
  font-size: clamp(13px, 0.85vw, 16px);
  font-weight: normal;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#remaining {
  margin-top: 2px;
  font-size: clamp(11px, 0.7vw, 13px);
  color: rgba(255,255,255,0.55);
  white-space: nowrap;
}


#footer {
  position: fixed;
  right: clamp(12px, 1.1vw, 20px);
  bottom: clamp(50px, 5.5vh, 60px);

  color: white;
  font-size: clamp(13px, 0.85vw, 16px);
  font-weight: bold;
  text-shadow: 2px 2px 5px black;

  white-space: nowrap;
}


@media (max-width: 700px) {
  #lessonInfo {
    width: 94vw;
    bottom: 75px;
  }

  #footer {
    right: 12px;
    bottom: 50px;
  }
}


@media (max-height: 600px) {
  #lessonInfo {
    bottom: 60px;
  }

  #footer {
    bottom: 35px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="clock-area">

    <div id="clock"></div>

    <div class="date-area">
      <div id="day"></div>
      <div id="date"></div>
    </div>

  </div>
</div>

<div id="lessonInfo">
  <div id="status">OKUL DIŞI</div>
  <div id="lesson"></div>
  <div id="remaining"></div>
</div>

<div id="footer">Aso Teknik Koleji "ÖTB"</div>

<script>


const schedule = {

  1: [
    ["09:00","09:40","İNGİLİZCE"],
    ["09:50","10:30","İNGİLİZCE"],
    ["10:40","11:20","BEDEN EĞİTİMİ"],
    ["11:30","12:10","BEDEN EĞİTİMİ"],
    ["12:50","13:30","DİN KÜLTÜRÜ"],
    ["13:40","14:20","KİMYA"],
    ["14:30","15:10","MATEMATİK"],
    ["15:15","15:55","MATEMATİK"]
  ],

  2: [
    ["09:00","09:40","ATÖLYE"],
    ["09:50","10:30","ATÖLYE"],
    ["10:40","11:20","ATÖLYE"],
    ["11:30","12:10","ATÖLYE"],
    ["12:50","13:30","ATÖLYE"],
    ["13:40","14:20","ATÖLYE"],
    ["14:30","15:10","ATÖLYE"],
    ["15:15","15:55","SANAT EĞİTİMİ"]
  ],

  3: [
    ["09:00","09:40","ALMANCA"],
    ["09:50","10:30","ALMANCA"],
    ["10:40","11:20","EDEBİYAT"],
    ["11:30","12:10","EDEBİYAT"],
    ["12:50","13:30","SENSÖRLER"],
    ["13:40","14:20","SENSÖRLER"],
    ["14:30","15:10","FİZİK"],
    ["15:15","15:55","FİZİK"]
  ],

  4: [
    ["09:00","09:40","MODELLEME VE MONTAJ"],
    ["09:50","10:30","MODELLEME VE MONTAJ"],
    ["10:40","11:20","MATEMATİK"],
    ["11:30","12:10","ATÖLYE"],
    ["12:50","13:30","EDEBİYAT"],
    ["13:40","14:20","EDEBİYAT"],
    ["14:30","15:10","REHBERLİK VE YÖNLENDİRME"],
    ["15:15","15:55","TÜRK DİLİ VE EDEBİYATI"]
  ],

  5: [
    ["09:00","09:40","TARİH"],
    ["09:50","10:30","TARİH"],
    ["10:40","11:20","MATEMATİK"],
    ["11:30","12:10","ATÖLYE"],
    ["13:30","14:10","TÜRK DÜŞÜNCE TARİHİ"],
    ["14:20","15:00","FELSEFE"],
    ["15:10","15:50","EDEBİYAT"],
    ["15:55","16:35","EDEBİYAT"]
  ]
};

const days = [
  "PAZAR",
  "PAZARTESİ",
  "SALI",
  "ÇARŞAMBA",
  "PERŞEMBE",
  "CUMA",
  "CUMARTESİ"
];

const months = [
  "OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN",
  "TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"
];

function toMinutes(value) {
  const parts = value.split(":");
  return Number(parts[0]) * 60 + Number(parts[1]);
}

function remainingText(seconds) {
  seconds = Math.max(0, seconds);

  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return "Kalan " +
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}

function updateClockAndDate(now) {

  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  document.getElementById("clock").textContent =
    h + ":" + m + ":" + s;

  document.getElementById("day").textContent =
    days[now.getDay()];

  document.getElementById("date").textContent =
    String(now.getDate()).padStart(2,"0") +
    " " +
    months[now.getMonth()] +
    " " +
    now.getFullYear();
}

function updateLesson(now) {

  const status = document.getElementById("status");
  const lesson = document.getElementById("lesson");
  const remaining = document.getElementById("remaining");

  const day = now.getDay();

  if (!schedule[day]) {
    status.textContent = "OKUL DIŞI";
    lesson.textContent = "";
    remaining.textContent = "";
    return;
  }

  const currentMinutes =
    now.getHours() * 60 + now.getMinutes();

  const currentSeconds =
    now.getSeconds();

  const lessons = schedule[day];

  for (let i = 0; i < lessons.length; i++) {

    const start = toMinutes(lessons[i][0]);
    const end = toMinutes(lessons[i][1]);
    const name = lessons[i][2];

    if (
      currentMinutes >= start &&
      currentMinutes < end
    ) {

      const nowTotal =
        currentMinutes * 60 + currentSeconds;

      const endTotal =
        end * 60;

      status.textContent =
        (i + 1) + ". DERS";

      lesson.textContent = name;

      remaining.textContent =
        remainingText(endTotal - nowTotal);

      return;
    }

    if (i < lessons.length - 1) {

      const nextStart =
        toMinutes(lessons[i + 1][0]);

      if (
        currentMinutes >= end &&
        currentMinutes < nextStart
      ) {

        const nowTotal =
          currentMinutes * 60 + currentSeconds;

        const nextTotal =
          nextStart * 60;

        
        if (i === 3) {
          status.textContent = "ÖĞLE ARASI";
        } else {
          status.textContent = "TENEFFÜS";
        }

        lesson.textContent =
          "Sonraki: " + lessons[i + 1][2];

        remaining.textContent =
          remainingText(nextTotal - nowTotal);

        return;
      }
    }
  }

  status.textContent = "OKUL DIŞI";
  lesson.textContent = "";
  remaining.textContent = "";
}

function update() {
  const now = new Date();

  updateClockAndDate(now);
  updateLesson(now);
}

update();
setInterval(update, 1000);



document.addEventListener("contextmenu", e => e.preventDefault(), true);
document.addEventListener("selectstart", e => e.preventDefault(), true);
document.addEventListener("dragstart", e => e.preventDefault(), true);
document.addEventListener("copy", e => e.preventDefault(), true);
document.addEventListener("cut", e => e.preventDefault(), true);
</script>

</body>
</html>
