<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atık Saat By Ömer Taha BATTAL</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #000;
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  pointer-events: none;
}

#main {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

#clockArea {
  width: 100%;
  max-width: 100%;
  padding: 0 clamp(12px, 3vw, 40px);
  text-align: center;
  overflow: hidden;
}

#clock {
  color: #fff;
  font-size: clamp(56px, 6vw + 7vh, 260px);
  line-height: 1;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
  text-shadow: 3px 3px 12px #000;
  font-variant-numeric: tabular-nums;
}

#day {
  margin-top: clamp(6px, 1vh, 16px);
  color: #fff;
  font-size: clamp(16px, 1.3vw + 1.1vh, 32px);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: 2px;
  white-space: nowrap;
  text-shadow: 2px 2px 6px #000;
}

#date {
  margin-top: clamp(3px, 0.5vh, 8px);
  color: #bdbdbd;
  font-size: clamp(13px, 1vw + 0.8vh, 24px);
  line-height: 1.1;
  letter-spacing: 1px;
  white-space: nowrap;
  text-shadow: 2px 2px 6px #000;
  font-variant-numeric: tabular-nums;
}

#lessonInfo {
  position: fixed;
  left: 50%;
  bottom: clamp(56px, 7vh, 110px);
  transform: translateX(-50%);
  width: min(92vw, 900px);
  max-width: calc(100vw - 40px);
  text-align: center;
  color: rgba(255,255,255,0.8);
  text-shadow: 2px 2px 6px #000;
  overflow: hidden;
}

#status,
#lesson,
#remaining {
  display: block;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#status {
  font-size: clamp(13px, 0.85vw + 0.75vh, 24px);
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: 2px;
}

#lesson {
  margin-top: clamp(3px, 0.5vh, 8px);
  font-size: clamp(15px, 1vw + 0.9vh, 28px);
  line-height: 1.2;
  font-weight: 500;
}

#remaining {
  margin-top: clamp(2px, 0.4vh, 6px);
  color: rgba(255,255,255,0.6);
  font-size: clamp(13px, 0.8vw + 0.65vh, 22px);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

#footer {
  position: fixed;
  right: clamp(14px, 2vw, 28px);
  bottom: clamp(56px, 6vh, 90px);
  color: #fff;
  font-size: clamp(12px, 0.8vw + 0.6vh, 20px);
  line-height: 1.1;
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 2px 2px 6px #000;
}
</style>
</head>

<body>

<div id="main">
  <div id="clockArea">
    <div id="clock"></div>
    <div id="day"></div>
    <div id="date"></div>
  </div>
</div>

<div id="lessonInfo">
  <div id="status">OKUL DIŞI</div>
  <div id="lesson"></div>
  <div id="remaining"></div>
</div>

<div id="footer">Aso Teknik Koleji "ÖTB"</div>

<script>
const schedule = {
  1: [
    ["09:00","09:40","İNGİLİZCE"],
    ["09:50","10:30","İNGİLİZCE"],
    ["10:40","11:20","BEDEN EĞİTİMİ"],
    ["11:30","12:10","BEDEN EĞİTİMİ"],
    ["12:50","13:30","DİN KÜLTÜRÜ"],
    ["13:40","14:20","KİMYA"],
    ["14:30","15:10","KİMYA"],
    ["15:15","15:55","MATEMATİK"],
    ["16:00","16:40","MATEMATİK"]
  ],
  2: [
    ["09:00","09:40","ATÖLYE"],
    ["09:50","10:30","ATÖLYE"],
    ["10:40","11:20","ATÖLYE"],
    ["11:30","12:10","ATÖLYE"],
    ["12:50","13:30","ATÖLYE"],
    ["13:40","14:20","ATÖLYE"],
    ["14:30","15:10","ATÖLYE"],
    ["15:15","15:55","ATÖLYE"],
    ["16:00","16:40","SANAT EĞİTİMİ"]
  ],
  3: [
    ["09:00","09:40","ALMANCA"],
    ["09:50","10:30","ALMANCA"],
    ["10:40","11:20","TÜRK DİLİ VE EDEBİYATI"],
    ["11:30","12:10","TÜRK DİLİ VE EDEBİYATI"],
    ["12:50","13:30","SENSÖRLER"],
    ["13:40","14:20","SENSÖRLER"],
    ["14:30","15:10","FİZİK"],
    ["15:15","15:55","FİZİK"],
    ["16:00","16:40","FELSEFE"]
  ],
  4: [
    ["09:00","09:40","MODELLEME VE MONTAJ"],
    ["09:50","10:30","MODELLEME VE MONTAJ"],
    ["10:40","11:20","BİYOLOJİ"],
    ["11:30","12:10","BİYOLOJİ"],
    ["12:50","13:30","MATEMATİK"],
    ["13:40","14:20","MATEMATİK"],
    ["14:30","15:10","DİN KÜLTÜRÜ"],
    ["15:15","15:55","COĞRAFYA"],
    ["16:00","16:40","COĞRAFYA"]
  ],
  5: [
    ["09:00","09:40","TARİH"],
    ["09:50","10:30","TARİH"],
    ["10:40","11:20","MATEMATİK"],
    ["11:30","12:10","ATÖLYE"],
    ["13:30","14:10","TÜRK DÜŞÜNCE TARİHİ"],
    ["14:20","15:00","FELSEFE"],
    ["15:10","15:50","TÜRK DİLİ VE EDEBİYATI"],
    ["15:55","16:35","TÜRK DİLİ VE EDEBİYATI"],
    ["16:35","16:35","REHBERLİK VE YÖNLENDİRME"]
  ]
};

const days = [
  "PAZAR",
  "PAZARTESİ",
  "SALI",
  "ÇARŞAMBA",
  "PERŞEMBE",
  "CUMA",
  "CUMARTESİ"
];

const months = [
  "OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN",
  "TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"
];

function toMinutes(value) {
  const parts = value.split(":");
  return Number(parts[0]) * 60 + Number(parts[1]);
}

function remainingText(seconds) {
  seconds = Math.max(0, seconds);
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return "Kalan " +
    String(minutes).padStart(2,"0") + ":" +
    String(secs).padStart(2,"0");
}

function updateClockAndDate(now) {
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  document.getElementById("clock").textContent = h + ":" + m + ":" + s;
  document.getElementById("day").textContent = days[now.getDay()];

  document.getElementById("date").textContent =
    String(now.getDate()).padStart(2,"0") + " " +
    months[now.getMonth()] + " " +
    now.getFullYear();
}

function updateLesson(now) {
  const status = document.getElementById("status");
  const lesson = document.getElementById("lesson");
  const remaining = document.getElementById("remaining");
  const day = now.getDay();

  if (!schedule[day]) {
    status.textContent = "OKUL DIŞI";
    lesson.textContent = "";
    remaining.textContent = "";
    return;
  }

  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const currentSeconds = now.getSeconds();
  const lessons = schedule[day];

  for (let i = 0; i < lessons.length; i++) {
    const start = toMinutes(lessons[i][0]);
    const end = toMinutes(lessons[i][1]);
    const name = lessons[i][2];

    if (currentMinutes >= start && currentMinutes < end) {
      const nowTotal = currentMinutes * 60 + currentSeconds;
      const endTotal = end * 60;

      status.textContent = (i + 1) + ". DERS";
      lesson.textContent = name;
      remaining.textContent = remainingText(endTotal - nowTotal);
      return;
    }

    if (i < lessons.length - 1) {
      const nextStart = toMinutes(lessons[i + 1][0]);

      if (currentMinutes >= end && currentMinutes < nextStart) {
        const nowTotal = currentMinutes * 60 + currentSeconds;
        const nextTotal = nextStart * 60;

        status.textContent = (i === 3) ? "ÖĞLE ARASI" : "TENEFFÜS";
        lesson.textContent = "Sonraki: " + lessons[i + 1][2];
        remaining.textContent = remainingText(nextTotal - nowTotal);
        return;
      }
    }
  }

  status.textContent = "OKUL DIŞI";
  lesson.textContent = "";
  remaining.textContent = "";
}

function update() {
  const now = new Date();
  updateClockAndDate(now);
  updateLesson(now);
}

update();
setInterval(update, 1000);

document.addEventListener("contextmenu", e => e.preventDefault(), true);
document.addEventListener("selectstart", e => e.preventDefault(), true);
document.addEventListener("dragstart", e => e.preventDefault(), true);
document.addEventListener("copy", e => e.preventDefault(), true);
document.addEventListener("cut", e => e.preventDefault(), true);
</script>

</body>
</html>
